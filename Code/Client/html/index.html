<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập | Hệ thống Quản lý TTTN</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="background-decoration">
        <div class="wave wave-1"></div>
        <div class="wave wave-2"></div>
        <div class="wave wave-3"></div>
    </div>


    <!-- ===== LOGIN PAGE ===== -->
    <main class="login-page">

        <!-- ===== LOGIN CARD ===== -->
        <div class="login-container">

            <!-- Logo -->
            <div class="login-header">

                <div class="logo-circle">
                    🎓
                </div>

                <h2>
                    QUẢN LÝ THỰC TẬP TỐT NGHIỆP
                </h2>

                <p>
                    
                </p>

            </div>


            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" class="login-form">

                <!-- Mã định danh -->
                <div class="form-group">

                    <label for="userCode">
                        Mã định danh
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                        
                        </span>

                        <input
                            type="text"
                            id="userCode"
                            placeholder="Nhập MSSV / Mã GV "
                            autocomplete="off"
                            required
                        />

                    </div>

                </div>


                <!-- Mật khẩu -->
                <div class="form-group">

                    <label for="password">
                        Mật khẩu
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                    
                        </span>

                        <input
                            type="password"
                            id="password"
                            placeholder="••••••••••"
                            required
                        />

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Hiện mật khẩu"
                            title="Hiện mật khẩu"
                        >
                            <svg class="password-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>
                            <svg class="password-icon eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="m3 3 18 18"></path>
                                <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.7 18.7 0 0 1-3.1 3.7M6.7 6.7C3.7 8.5 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 3.4-.6"></path>
                                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                            </svg>
                        </button>

                    </div>

                </div>


                <!-- Thông báo lỗi -->
                <div
                    id="errorMessage"
                    class="error-message">
                </div>

                <!-- Quên mật khẩu -->
                <div class="forgot-password-link">
                    <a href="#" id="openForgotPasswordBtn">Quên mật khẩu?</a>
                </div>

                <!-- Nút đăng nhập -->
                <button
                    type="submit"
                    id="submitBtn"
                    class="btn-submit">

                    <span>
                        Đăng nhập hệ thống
                    </span>

                </button>

            </form>


            <!-- ===== FOOTER ===== -->
            <div class="login-footer">

                <p>
                   
                </p>

            </div>

        </div>

    </main>


    <!-- ===== MODAL QUÊN MẬT KHẨU ===== -->
    <div id="forgotPasswordModal" class="fp-modal-overlay">
        <div class="fp-modal-box">
            <button type="button" id="closeForgotPasswordBtn" class="fp-modal-close">&times;</button>

            <h3>Khôi phục mật khẩu</h3>
            <p class="fp-modal-desc">
                Nhập Mã định danh và Email đã đăng ký với tài khoản. Hệ thống sẽ đặt lại mật khẩu tạm thời cho bạn.
            </p>

            <form id="forgotPasswordForm" novalidate>
                <div class="form-group">
                    <label for="fpUserCode">Mã định danh</label>
                    <div class="input-wrapper">
                        <input type="text" id="fpUserCode" placeholder="Nhập MSSV / Mã GV" autocomplete="off" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="fpEmail">Email đã đăng ký</label>
                    <div class="input-wrapper">
                        <input type="email" id="fpEmail" placeholder="Nhập email đã đăng ký" autocomplete="off" required />
                    </div>
                </div>

                <div id="forgotPasswordMessage" class="fp-message"></div>

                <button type="submit" id="fpSubmitBtn" class="btn-submit">
                    <span>Xác nhận khôi phục</span>
                </button>
            </form>
        </div>
    </div>

    <!-- ===== STYLE RIÊNG CHO MODAL QUÊN MẬT KHẨU ===== -->
    <style>
        .forgot-password-link {
            text-align: right;
            margin: -8px 0 16px;
        }
        .forgot-password-link a {
            font-size: 0.9rem;
            color: #2563eb;
            text-decoration: none;
        }
        .forgot-password-link a:hover {
            text-decoration: underline;
        }
        .fp-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .fp-modal-overlay.active {
            display: flex;
        }
        .fp-modal-box {
            background: #fff;
            width: 90%;
            max-width: 420px;
            border-radius: 14px;
            padding: 28px 24px;
            position: relative;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        }
        .fp-modal-box h3 {
            margin: 0 0 8px;
            font-size: 1.25rem;
        }
        .fp-modal-desc {
            font-size: 0.88rem;
            color: #64748b;
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .fp-modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            color: #64748b;
        }
        .fp-message {
            font-size: 0.85rem;
            margin: 4px 0 14px;
            line-height: 1.5;
        }
        .fp-message.error { color: #ef4444; }
        .fp-message.success { color: #10b981; }
    </style>


    <!-- ===== JAVASCRIPT ===== -->
    <script src="../js/login.js"></script>

</body>
</html>
