<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Tiến Độ Nhóm | Cổng Giảng Viên</title>
    <link rel="stylesheet" href="../css/lecturer.css">
    <link rel="stylesheet" href="../css/lecturer-progress-detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="main-wrapper progress-detail-page">
        <a href="lecturer-topics.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i><span>Quay lại danh sách đề tài</span>
        </a>

        <!-- 1. THÔNG TIN CHUNG NHÓM -->
        <div class="progress-header-card" id="progressHeader">
            <div class="topic-heading">
                <span class="status-pill" id="topicStatus">Đang thực hiện</span>
                <span class="topic-kicker">CHI TIẾT NHÓM HƯỚNG DẪN</span>
            </div>
            <h2 id="topicTitle">Đang tải dữ liệu...</h2>
            <p id="topicMeta">Đang tải thông tin đề tài...</p>
            <div class="members-heading"><i class="fa-solid fa-users"></i> Thành viên nhóm</div>
            <div class="member-list" id="memberList"></div>
        </div>

        <!-- 2. THEO DÕI TIẾN ĐỘ THEO CỘT MỐC (MILESTONES) -->
        <div class="section-heading"><h3>Tiến độ các giai đoạn</h3><span>5 mốc báo cáo</span></div>
        <div class="milestone-tracker" id="milestoneTracker"></div>

        <!-- 3. BẢNG BÁO CÁO HÀNG TUẦN & ĐÁNH GIÁ CỦA GV -->
        <div class="table-card submissions-card">
            <div class="card-header">
                <h3>Danh sách báo cáo công việc đã nộp</h3>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Tuần / Ngày nộp</th>
                        <th>Nội dung công việc</th>
                        <th>File đính kèm</th>
                        <th>Đánh giá của GV</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="submissionTableBody"></tbody>
            </table>
        </div>
    </div>
    <script src="../js/lecturer-progress-detail.js"></script>
</body>
</html>
