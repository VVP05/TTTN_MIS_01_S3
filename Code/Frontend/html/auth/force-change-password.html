<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/html/auth/">
    <title>Đổi mật khẩu bắt buộc | Hệ thống Quản lý TTTN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/auth/password-flow.css">
</head>
<body class="password-flow-page">
    <main class="password-flow-card">

        <div class="pf-header">
            <div class="pf-icon pf-icon-warning">
                <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
            </div>
            <h1>Cần đổi mật khẩu</h1>
            <p>Để bảo vệ tài khoản, hãy đổi mật khẩu ban đầu trước khi tiếp tục sử dụng hệ thống.</p>
        </div>

        <form id="forceChangePasswordForm" novalidate>

            <div class="pf-field">
                <label for="currentPassword">Mật khẩu hiện tại</label>
                <div class="pf-input-wrap">
                    <i class="fa-solid fa-lock pf-input-icon" aria-hidden="true"></i>
                    <input id="currentPassword" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu hiện tại" required>
                    <button type="button" class="pf-toggle" data-target="currentPassword" aria-label="Hiện mật khẩu">
                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <div class="pf-field">
                <label for="newPassword">Mật khẩu mới</label>
                <div class="pf-input-wrap">
                    <i class="fa-solid fa-lock-open pf-input-icon" aria-hidden="true"></i>
                    <input id="newPassword" type="password" autocomplete="new-password" placeholder="Ít nhất 8 ký tự" required>
                    <button type="button" class="pf-toggle" data-target="newPassword" aria-label="Hiện mật khẩu mới">
                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <!-- Strength meter -->
                <div class="pf-strength-bar" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </div>
                <p class="pf-strength-label" id="strengthLabel" aria-live="polite"></p>
            </div>

            <div class="pf-field">
                <label for="confirmPassword">Nhập lại mật khẩu mới</label>
                <div class="pf-input-wrap">
                    <i class="fa-solid fa-check-double pf-input-icon" aria-hidden="true"></i>
                    <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới" required>
                    <button type="button" class="pf-toggle" data-target="confirmPassword" aria-label="Hiện nhập lại">
                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <p id="forceChangeMessage" class="password-flow-message" role="status" aria-live="polite"></p>

            <button id="forceChangeSubmit" class="password-flow-submit" type="submit">
                <span>Đổi mật khẩu</span>
            </button>
        </form>

        <p class="pf-footer-note">
            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
            Mật khẩu mới phải khác mật khẩu cũ và đủ mạnh để bảo vệ tài khoản.
        </p>
    </main>

    <script src="../../js/config.js"></script>
    <script src="../../js/auth/force-change-password.js"></script>
    <script>
        // Toggle show/hide password
        document.querySelectorAll('.pf-toggle').forEach(btn => {
            btn.addEventListener('click', function () {
                const inp = document.getElementById(this.dataset.target);
                const icon = this.querySelector('i');
                if (!inp) return;
                const show = inp.type === 'password';
                inp.type = show ? 'text' : 'password';
                icon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
                this.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
            });
        });

        // Simple strength meter
        const newPwInp = document.getElementById('newPassword');
        const strengthBar = document.querySelector('.pf-strength-bar');
        const strengthLabel = document.getElementById('strengthLabel');
        if (newPwInp && strengthBar) {
            newPwInp.addEventListener('input', function () {
                const v = this.value;
                let score = 0;
                if (v.length >= 8) score++;
                if (/[A-Z]/.test(v)) score++;
                if (/[0-9]/.test(v)) score++;
                if (/[^A-Za-z0-9]/.test(v)) score++;
                const levels = ['', 'Yếu', 'Trung bình', 'Khá mạnh', 'Mạnh'];
                const cls = ['', 'weak', 'fair', 'good', 'strong'];
                strengthBar.className = 'pf-strength-bar' + (v ? ' s' + score : '');
                if (strengthLabel) strengthLabel.textContent = v ? levels[score] : '';
            });
        }
    </script>
</body>
</html>
