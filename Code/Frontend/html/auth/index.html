<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Hệ thống Quản lý TTTN</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/auth/style.css">
    <link rel="stylesheet" href="../../css/common/app-notifications.css">
</head>

<body>

    <!-- ===== LOGIN CARD ===== -->
    <main class="auth-card" role="main">

        <!-- Header -->
        <header class="auth-card-header">
            <div class="auth-logo-wrap" aria-hidden="true">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1 class="auth-title">Hệ thống quản lý<br>thực tập tốt nghiệp</h1>
        </header>

        <!-- Form -->
        <form id="loginForm" class="auth-form" autocomplete="on" novalidate>

            <!-- Mã định danh -->
            <div class="auth-field">
                <label for="userCode">Mã định danh</label>
                <div class="auth-input-wrap">
                    <i class="fa-regular fa-user auth-input-icon" aria-hidden="true"></i>
                    <input
                        type="text"
                        id="userCode"
                        name="username"
                        placeholder="Nhập MSSV / Mã GV"
                        autocomplete="username"
                        autofocus
                        required
                    />
                </div>
            </div>

            <!-- Mật khẩu -->
            <div class="auth-field">
                <label for="password">Mật khẩu</label>
                <div class="auth-input-wrap">
                    <i class="fa-solid fa-lock auth-input-icon" aria-hidden="true"></i>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••••"
                        autocomplete="current-password"
                        required
                    />
                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Hiện mật khẩu"
                        title="Hiện mật khẩu"
                    >
                        <svg class="password-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                            <circle cx="12" cy="12" r="2.5"></circle>
                        </svg>
                        <svg class="password-icon eye-off" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m3 3 18 18"></path>
                            <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.7 18.7 0 0 1-3.1 3.7M6.7 6.7C3.7 8.5 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 3.4-.6"></path>
                            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                        </svg>
                    </button>
                </div>
                <!-- Cảnh báo Caps Lock -->
                <p id="capsLockWarning" class="caps-lock-warn" hidden aria-live="polite">
                    <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> Caps Lock đang bật
                </p>
            </div>

            <!-- Quên mật khẩu -->
            <div class="auth-forgot-row">
                <a href="#" id="openForgotPasswordBtn" class="auth-forgot-link">Quên mật khẩu?</a>
            </div>

            <!-- Thông báo lỗi inline phía trên nút -->
            <div id="errorMessage" class="auth-error-banner" role="alert" aria-live="polite" hidden></div>

            <!-- Nút đăng nhập -->
            <button type="submit" id="submitBtn" class="auth-btn-submit">
                <span class="btn-spinner" hidden aria-hidden="true"></span>
                <span class="btn-text">Đăng nhập hệ thống</span>
            </button>

            <!-- Dòng trợ giúp -->
            <p class="auth-help-text">Gặp vấn đề khi đăng nhập? Liên hệ <strong>Văn phòng Khoa</strong></p>

        </form>

    </main>

    <!-- ===== MODAL QUÊN MẬT KHẨU ===== -->
    <div id="forgotPasswordModal" class="fp-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="fpModalTitle">
        <div class="fp-modal-box">
            <button type="button" id="closeForgotPasswordBtn" class="fp-modal-close" aria-label="Đóng">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>

            <div class="fp-modal-icon" aria-hidden="true">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 id="fpModalTitle" class="fp-modal-title">Khôi phục mật khẩu</h2>
            <p class="fp-modal-desc">
                Nhập Mã định danh và Email đã đăng ký. Nếu thông tin khớp, hệ thống sẽ gửi liên kết đặt lại mật khẩu đến email đó. Liên kết có hiệu lực trong 15 phút.
            </p>

            <form id="forgotPasswordForm" novalidate>
                <div class="auth-field">
                    <label for="fpUserCode">Mã định danh</label>
                    <div class="auth-input-wrap">
                        <i class="fa-regular fa-user auth-input-icon" aria-hidden="true"></i>
                        <input type="text" id="fpUserCode" placeholder="Nhập MSSV / Mã GV" autocomplete="off" required/>
                    </div>
                </div>

                <div class="auth-field">
                    <label for="fpEmail">Email đã đăng ký</label>
                    <div class="auth-input-wrap">
                        <i class="fa-regular fa-envelope auth-input-icon" aria-hidden="true"></i>
                        <input type="email" id="fpEmail" placeholder="Nhập email đã đăng ký" autocomplete="off" required/>
                    </div>
                </div>

                <div id="forgotPasswordMessage" class="fp-message" aria-live="polite"></div>

                <button type="submit" id="fpSubmitBtn" class="auth-btn-submit" style="margin-top: 4px;">
                    <span class="btn-spinner" hidden aria-hidden="true"></span>
                    <span class="btn-text">Xác nhận khôi phục</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Overlay loading toàn trang -->
    <div id="loginLoadingOverlay" class="login-loading-overlay" hidden role="status" aria-label="Đang đăng nhập" aria-live="polite">
        <span class="login-loading-spinner" aria-hidden="true"></span>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="../../js/config.js"></script>
    <script src="../../js/auth/login.js"></script>
    <script src="../../js/common/app-notifications.js"></script>

    <!-- Caps Lock detection -->
    <script>
        (function () {
            const pw = document.getElementById('password');
            const warn = document.getElementById('capsLockWarning');
            if (!pw || !warn) return;
            const toggle = (e) => {
                if (typeof e.getModifierState === 'function') {
                    warn.hidden = !e.getModifierState('CapsLock');
                }
            };
            pw.addEventListener('keydown', toggle);
            pw.addEventListener('keyup', toggle);
        })();
    </script>
</body>
</html>
